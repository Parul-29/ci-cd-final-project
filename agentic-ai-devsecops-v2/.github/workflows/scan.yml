name: Trigger Security Scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  trigger-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Call scan API
        env:
          SCAN_URL: ${{ secrets.SCAN_API_URL }}
        run: |
          curl --fail-with-body --retry 3 -X POST "$SCAN_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "repository": "${{ github.repository }}",
              "branch": "${{ github.ref_name }}",
              "commit_sha": "${{ github.sha }}",
              "changed_files": [],
              "metadata": {
                "event": "${{ github.event_name }}",
                "actor": "${{ github.actor }}"
              }
            }'